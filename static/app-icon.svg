<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Menzies Calculator">
  <!-- Lucide Calculator + water-block circle backdrop (music-mobile soft mist recipe). Paper #F7F4EF. Black stroke, no outline. -->
  <defs>
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="round-safe">
      <rect width="512" height="512" rx="108" ry="108"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round-safe)">
    <!-- Paper base -->
    <rect width="512" height="512" fill="#F7F4EF"/>

    <!-- Subtle fiber wash -->
    <ellipse cx="120" cy="90" rx="160" ry="120" fill="#E8E1D4" opacity="0.55" filter="url(#soft-blur)"/>
    <ellipse cx="400" cy="420" rx="180" ry="140" fill="#E8E1D4" opacity="0.5" filter="url(#soft-blur)"/>

    <!-- Water-block circles (music-mobile soft mist; no fractal splash blotches) -->
    <circle cx="256" cy="256" r="175" fill="#D9EEF5" opacity="0.55" filter="url(#soft-blur)"/>
    <circle cx="210" cy="230" r="80" fill="#F2E1C6" opacity="0.35" filter="url(#soft-blur)"/>
    <circle cx="300" cy="290" r="70" fill="#E8C9C3" opacity="0.28" filter="url(#soft-blur)"/>
    <!-- Soft mineral tint rings at edges of the water block -->
    <circle cx="160" cy="340" r="55" fill="#276C8E" opacity="0.12" filter="url(#soft-blur)"/>
    <circle cx="360" cy="180" r="50" fill="#B87524" opacity="0.12" filter="url(#soft-blur)"/>
    <circle cx="380" cy="360" r="45" fill="#A33A32" opacity="0.1" filter="url(#soft-blur)"/>

    <!-- Lucide Calculator (24 viewBox), scale 17.2 ≈ 80.6% of 512. Stroke 2.2 black, fill none, no hairline outline. -->
    <g
      transform="translate(256 256) scale(17.2) translate(-12 -12)"
      fill="none"
      stroke="#000000"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <rect width="16" height="20" x="4" y="2" rx="2"/>
      <line x1="8" x2="16" y1="6" y2="6"/>
      <line x1="16" x2="16" y1="14" y2="18"/>
      <path d="M16 10h.01"/>
      <path d="M12 10h.01"/>
      <path d="M8 10h.01"/>
      <path d="M12 14h.01"/>
      <path d="M8 14h.01"/>
      <path d="M12 18h.01"/>
      <path d="M8 18h.01"/>
    </g>
  </g>
</svg>
